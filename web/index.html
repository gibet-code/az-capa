<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Capacity — Admin</title>
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/controls.css" />
  <link rel="stylesheet" href="styles/vm-coverage.css" />
  <link rel="stylesheet" href="styles/drawers.css" />
  <link rel="stylesheet" href="styles/responsive.css" />
  <link rel="icon" href="data:," />
  <script src="echarts.min.js"></script>
  <script src="js/shared/resources.js"></script>
  <script src="js/shared/http.js"></script>
  <script src="js/shared/tables.js"></script>
  <script src="js/shared/csv.js"></script>
  <script src="js/shared/business-context.js"></script>
  <script src="js/shared/report-model.js"></script>
  <script src="js/shared/echarts-adapter.js"></script>
  <script src="js/shared/preference-store.js"></script>
  <script src="js/features/odcr-usage-model.js"></script>
  <script src="js/features/odcr-usage.js"></script>
  <script src="js/features/coverage-report-model.js"></script>
  <script src="js/features/notifications.js"></script>
  <script src="js/features/administration.js"></script>
  <script src="js/features/data-collection.js"></script>
  <script src="js/features/scope.js"></script>
  <script src="js/features/vm-coverage.js"></script>
  <script src="js/features/vm-coverage-charts.js"></script>
  <script src="js/features/coverage-editor.js"></script>
  <script src="app.js"></script>
  <script defer src="alpine.min.js"></script>
</head>
<body>
  <div class="layout" x-data="app()" x-cloak
    @keydown.escape.window="notificationDrawerOpen = false; accountMenuOpen = false; scopeMenuOpen = false">
    <header class="global-header">
      <div class="header-brand">
        <span>Azure Capacity</span>
        <span x-show="user.local" class="environment-badge">Local dev</span>
      </div>
      <div class="header-actions">
        <div class="scope-control" x-show="user.capabilities.useOdcr" @click.outside="if (scopeMenuOpen) closeScopeMenu()">
          <button type="button" class="header-icon-button scope-button" title="Global filters"
            :class="{ active: scopeMenuOpen || globalScopeActive }" @click="scopeMenuOpen ? closeScopeMenu() : openScopeMenu()"
            :aria-expanded="scopeMenuOpen" aria-label="Edit global filters">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h16M7 12h10M10 19h4" />
              <circle cx="7" cy="5" r="1.5" /><circle cx="15" cy="12" r="1.5" /><circle cx="12" cy="19" r="1.5" />
            </svg>
            <span x-show="globalScopeActive" class="scope-active-dot"></span>
          </button>
          <div class="scope-menu" x-show="scopeMenuOpen" x-transition.opacity>
            <div class="scope-menu-head">
              <div>
                <strong>Global filters</strong>
              </div>
              <button type="button" class="icon-btn" @click="loadScopeInventory()"
                :disabled="scopeInventoryLoading" title="Refresh filter catalogue" aria-label="Refresh filter catalogue">
                <span :class="{ spinning: scopeInventoryLoading }" aria-hidden="true">&#8635;</span>
              </button>
            </div>
            <div class="scope-loading" x-show="scopeInventoryLoading && !scopeInventoryLoaded">Loading filter catalogue...</div>
            <div class="scope-error" x-show="scopeInventoryError">
              <span x-text="scopeInventoryError"></span>
              <button type="button" class="btn ghost" @click="loadScopeInventory()">Retry</button>
            </div>
            <div class="scope-menu-body" x-show="scopeInventoryLoaded">
              <template x-for="dimension in [
                { key: 'subscriptionIds', catalogue: 'subscriptions', label: 'Subscription' },
                { key: 'locations', catalogue: 'locations', label: 'Location' }
              ]" :key="dimension.key">
                <section class="scope-selector">
                  <div class="scope-selector-head">
                    <label class="scope-enable-toggle">
                      <input type="checkbox" role="switch" :checked="scopeDimensionEnabled(dimension.key)"
                        @change="setScopeDimensionEnabled(dimension.key, $event.target.checked)" />
                      <span class="scope-toggle-track" aria-hidden="true"></span>
                      <strong x-text="dimension.label"></strong>
                    </label>
                    <span x-show="scopeDimensionEnabled(dimension.key)"
                      x-text="(globalScopeDraft[dimension.key] || []).length + ' selected'"></span>
                  </div>
                  <div x-show="scopeDimensionEnabled(dimension.key)" class="scope-selector-content">
                    <input x-model="scopeSearch[dimension.catalogue]" type="search" class="multi-select-search"
                      :placeholder="'Search ' + dimension.label.toLocaleLowerCase() + 's'"
                      :aria-label="'Search ' + dimension.label.toLocaleLowerCase() + 's'" />
                    <label class="multi-select-option select-all">
                      <input type="checkbox"
                        :checked="(globalScopeDraft[dimension.key] || []).length === scopeCatalogue[dimension.catalogue].length"
                        :indeterminate.prop="(globalScopeDraft[dimension.key] || []).length > 0 && (globalScopeDraft[dimension.key] || []).length < scopeCatalogue[dimension.catalogue].length"
                        @change="toggleAllScopeDimensionValues(dimension.key)" />
                      <span x-text="'All ' + dimension.label.toLocaleLowerCase() + 's'"></span>
                    </label>
                    <div class="scope-options">
                      <template x-for="option in scopeOptions(dimension.catalogue)" :key="option.value">
                        <label class="multi-select-option">
                          <input type="checkbox" :checked="(globalScopeDraft[dimension.key] || []).includes(option.value)"
                            @change="toggleScopeDimensionValue(dimension.key, option.value, $event.target.checked)" />
                          <span class="scope-option-name" x-text="option.label" :title="option.secondaryLabel"></span>
                          <span class="scope-option-count mono" x-text="option.secondaryLabel"></span>
                        </label>
                      </template>
                      <div class="multi-select-empty" x-show="scopeOptions(dimension.catalogue).length === 0">No matching options</div>
                    </div>
                  </div>
                </section>
              </template>
              <template x-for="field in scopeCatalogue.contextFields" :key="field.fieldKey">
                <section class="scope-selector">
                  <div class="scope-selector-head">
                    <label class="scope-enable-toggle">
                      <input type="checkbox" role="switch" :checked="scopeContextCriterion(field.fieldKey) !== null"
                        @change="setScopeContextEnabled(field.fieldKey, $event.target.checked)" />
                      <span class="scope-toggle-track" aria-hidden="true"></span>
                      <strong x-text="field.name"></strong>
                    </label>
                    <span x-show="scopeContextCriterion(field.fieldKey)"
                      x-text="(scopeContextCriterion(field.fieldKey)?.values || []).length + ' selected'"></span>
                  </div>
                  <div x-show="scopeContextCriterion(field.fieldKey)" class="scope-selector-content">
                    <input x-model="scopeSearch.context[field.fieldKey]" type="search" class="multi-select-search"
                      :placeholder="'Search ' + field.name" :aria-label="'Search ' + field.name" />
                    <div class="scope-options">
                      <template x-for="option in scopeContextOptions(field)" :key="option.value === null ? '__not_mapped__' : option.value">
                        <label class="multi-select-option">
                          <input type="checkbox" :checked="(scopeContextCriterion(field.fieldKey)?.values || []).includes(option.value)"
                            @change="toggleScopeContextValue(field.fieldKey, option.value, $event.target.checked)" />
                          <span class="scope-option-name" x-text="option.label"></span>
                          <span class="scope-option-count" x-text="option.subscriptionCount + ' subs'"></span>
                        </label>
                      </template>
                    </div>
                  </div>
                </section>
              </template>
            </div>
            <div class="scope-menu-actions">
              <button type="button" class="btn" @click="applyGlobalScope()"
                :disabled="!scopeInventoryLoaded || scopeInventoryLoading || !globalScopeDraftValid">Save</button>
              <button type="button" class="btn ghost" @click="closeScopeMenu()">Cancel</button>
            </div>
          </div>
        </div>
        <button type="button" class="header-icon-button notification-button" x-show="user.capabilities.administer" title="Notifications"
          @click="notificationDrawerOpen = true; accountMenuOpen = false; scopeMenuOpen = false" aria-label="Open notifications">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" /></svg>
          <span x-show="runningCount > 0" class="notification-count" x-text="runningCount"></span>
        </button>
        <div class="account" @click.outside="accountMenuOpen = false">
          <button type="button" class="account-trigger" @click="accountMenuOpen = !accountMenuOpen; notificationDrawerOpen = false; scopeMenuOpen = false"
            :aria-expanded="accountMenuOpen" aria-label="Open user menu">
            <span class="account-avatar" x-text="user.name && user.name !== '…' ? user.name.charAt(0).toUpperCase() : '•'"></span>
            <span class="account-trigger-copy">
              <strong x-text="user.name"></strong>
              <small x-text="user.local ? user.detail : (user.authenticated ? 'Signed in' : user.detail)"></small>
            </span>
            <svg class="account-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
          </button>
          <div class="account-menu" x-show="accountMenuOpen" x-transition.opacity>
            <div class="account-menu-identity">
              <span class="account-avatar large" x-text="user.name && user.name !== '…' ? user.name.charAt(0).toUpperCase() : '•'"></span>
              <div>
                <strong x-text="user.name"></strong>
                <span x-text="user.detail"></span>
                <span x-text="user.roles.length ? user.roles.join(', ') : 'No application role'"></span>
              </div>
            </div>
            <div class="local-role-switcher" x-show="user.local">
              <span>Local role context</span>
              <div role="group" aria-label="Local role context">
                <template x-for="role in ['Admin', 'User', 'None']" :key="role">
                  <button type="button" class="btn ghost" :class="{ active: role === 'None' ? user.roles.length === 0 : user.roles.includes(role) }"
                    :disabled="localRoleSwitching" @click="switchLocalRole(role)" x-text="role"></button>
                </template>
              </div>
            </div>
            <button type="button" class="account-logout" @click="logout()" :disabled="!user.authenticated">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5M15 12H3M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4" /></svg>
              <span>Log out</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <aside class="sidebar" aria-label="Primary navigation">
      <nav class="nav">
        <a x-show="user.capabilities.useOdcr" :class="{ active: page === 'vm' }" @click="go('odcr/coverage')" title="On-Demand Capacity Reservations">
          <span class="nav-icon"><img src="icons/capacity-reservation-groups.svg" alt="" /></span>
          <span class="nav-label">ODCR</span>
        </a>
        <a class="settings-link" x-show="user.capabilities.administer" :class="{ active: page === 'settings' }" @click="go('settings')" title="Settings">
          <span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3v-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1h.09v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg></span>
          <span class="nav-label">Settings</span>
        </a>
      </nav>
    </aside>

    <!-- ── Main ────────────────────────────────────────────── -->
    <main class="main">
      <!-- Toasts (API errors, etc.) -->
      <div class="toasts">
        <template x-for="t in toasts" :key="t.id">
          <div class="toast" :class="t.kind">
            <span x-text="t.message"></span>
            <button class="toast-close" @click="dismissToast(t.id)" aria-label="Dismiss">&times;</button>
          </div>
        </template>
      </div>

      <template x-if="page === 'forbidden'">
        <div class="card access-denied">
          <h1>Access denied</h1>
          <p>This account does not have a recognized User or Admin application role.</p>
          <p x-show="user.local">Choose a local role context from the account menu to continue.</p>
        </div>
      </template>

      <!-- Settings -->
      <template x-if="page === 'settings'">
        <div>
          <h1>Settings</h1>

          <div class="tabs">
            <button :class="{ active: tab === 'app' }" @click="selectTab('app')">App settings</button>
            <button :class="{ active: tab === 'app-scope' }" @click="selectTab('app-scope')">App Scope</button>
            <button :class="{ active: tab === 'data' }" @click="selectTab('data')">Data Collection</button>
            <button :class="{ active: tab === 'business-context' }" @click="selectTab('business-context')">Business Context</button>
          </div>

          <!-- Tab: App settings -->
          <template x-if="tab === 'app'">
            <div>
              <template x-if="!settings"><div class="empty"><span class="spin"></span> Loading…</div></template>
              <template x-if="settings">
                <div>
                  <template x-for="group in settingsGroups" :key="group.title">
                    <div class="card">
                      <div class="card-head"><h3 x-text="group.title"></h3></div>
                      <table>
                        <tbody>
                          <template x-for="row in group.rows" :key="row.key">
                            <tr>
                              <td class="key" x-text="row.key"></td>
                              <td class="mono" x-text="row.value"></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- Tab: App Scope -->
          <template x-if="tab === 'app-scope'">
            <div>
              <template x-if="!appScope"><div class="empty"><span class="spin"></span> Loading…</div></template>
              <template x-if="appScope">
                <div>
                  <!-- Subscription scope -->
                  <div class="card">
                    <div class="card-head">
                      <div class="title-row">
                        <h3>Subscription scope</h3>
                        <button class="icon-btn" title="Refresh status" @click="loadAppScope()"
                          :class="{ spinning: appScopeLoading }" :disabled="appScopeLoading"
                          aria-label="Refresh status">&#8635;</button>
                      </div>
                      <div class="actions">
                        <span x-show="appScopeLoading" class="badge running"><span class="spin"></span> Loading…</span>
                        <span x-show="!appScopeLoading" class="badge" :class="appScopeHealth.badge" x-text="appScopeHealth.label"></span>
                      </div>
                    </div>
                    <template x-if="appScopeError">
                      <div class="error" x-text="'App Scope diagnostics unavailable: ' + appScopeError"></div>
                    </template>
                    <template x-if="!appScopeError">
                      <div>
                        <div :class="appScopeHealth.state === 'ok' ? 'muted' : appScopeHealth.state"
                          x-text="appScopeHealth.message"></div>
                        <table>
                          <tbody>
                            <tr>
                              <td class="key">Mode</td>
                              <td class="mono" x-text="appScope.modeLabel"></td>
                            </tr>
                            <tr>
                              <td class="key">Resolved subscriptions</td>
                              <td class="mono" x-text="appScope.resolvedCount ?? '—'"></td>
                            </tr>
                            <tr>
                              <td class="key">Reference data generation</td>
                              <td class="mono" x-text="appScope.enforced.generation || '—'"></td>
                            </tr>
                            <tr>
                              <td class="key">Reference data published</td>
                              <td class="mono" x-text="appScope.enforced.publishedAt ? formatDateTime(appScope.enforced.publishedAt) : '—'"></td>
                            </tr>
                            <tr>
                              <td class="key">Reference data stale</td>
                              <td><span class="badge" :class="appScope.enforced.stale ? 'warn' : 'ok'"
                                x-text="appScope.enforced.stale ? 'Yes' : 'No'"></span></td>
                            </tr>
                          </tbody>
                        </table>

                        <!-- Selected subscriptions breakdown -->
                        <template x-if="appScope.mode === 'subscriptions'">
                          <div>
                            <div class="muted" x-text="appScopeResolvedSummary"></div>
                            <table>
                              <thead><tr><th>Subscription ID</th><th>Status</th><th>Display name</th></tr></thead>
                              <tbody>
                                <template x-for="row in appScope.subscriptions" :key="row.id">
                                  <tr>
                                    <td class="mono" x-text="row.id"></td>
                                    <td><span class="badge" :class="row.resolved ? 'ok' : 'warn'"
                                      x-text="row.resolved ? 'Resolved' : 'Unresolved'"></span></td>
                                    <td class="mono" x-text="row.displayName || '—'"></td>
                                  </tr>
                                </template>
                              </tbody>
                            </table>
                          </div>
                        </template>

                        <!-- Selected management groups breakdown -->
                        <template x-if="appScope.mode === 'management_groups'">
                          <table>
                            <thead><tr><th>Management group ID</th><th>Resolved subscriptions</th></tr></thead>
                            <tbody>
                              <template x-for="row in appScope.managementGroups" :key="row.id">
                                <tr>
                                  <td class="mono" x-text="row.id"></td>
                                  <td><span class="badge" :class="row.count === 0 ? 'warn' : 'ok'" x-text="row.count"></span></td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </template>
                      </div>
                    </template>
                  </div>

                  <!-- Location scope -->
                  <div class="card">
                    <div class="card-head"><h3>Location scope</h3></div>
                    <table>
                      <tbody>
                        <tr>
                          <td class="key">Configured locations</td>
                          <td class="mono" x-text="(appScope.locations && appScope.locations.length) ? appScope.locations.join(', ') : 'All locations'"></td>
                        </tr>
                        <tr>
                          <td class="key">Location boundary</td>
                          <td class="mono" x-text="(appScope.locations && appScope.locations.length) ? (appScope.locations.length + ' location' + (appScope.locations.length === 1 ? '' : 's')) : 'All locations'"></td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                  <!-- Administrator guidance -->
                  <div class="card">
                    <div class="card-head"><h3>Administrator guidance</h3></div>
                    <ol class="app-scope-guidance">
                      <li>Update <code>SCOPE_SUBSCRIPTION_IDS</code> or <code>SCOPE_MANAGEMENT_GROUP_IDS</code>.</li>
                      <li>Update <code>SCOPE_LOCATIONS</code> when the location boundary must change.</li>
                      <li>Refresh Subscription Reference Data if a selector is unresolved because the inventory is stale.</li>
                      <li>Restart the Function App for new environment values to take effect.</li>
                    </ol>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <!-- Tab: Business Context -->
          <template x-if="tab === 'business-context'">
            <section class="business-context-panel">
              <div class="business-context-command-bar">
                <h2>Context fields</h2>
              </div>

              <div x-show="businessContextLoading" class="empty"><span class="spin"></span> Loading…</div>
              <template x-if="businessContext && !businessContextLoading">
                <div class="card business-context-card">
                  <div class="vm-command-bar">
                    <button type="button" class="vm-command-button" @click="openBusinessContextEditor()"
                      :disabled="!businessContext || businessContext.count >= businessContext.maxFields">
                      <span class="vm-command-icon" aria-hidden="true">&#43;</span>
                      <span>Add field</span>
                    </button>
                    <button type="button" class="vm-command-button" @click="loadBusinessContextFields()"
                      :disabled="businessContextLoading">
                      <span class="vm-command-icon" :class="{ spinning: businessContextLoading }" aria-hidden="true">&#8635;</span>
                      <span>Refresh</span>
                    </button>
                  </div>
                  <div x-show="businessContext.value.length === 0" class="empty">No context fields configured.</div>
                  <div class="vm-table-frame bc-fields-frame" x-show="businessContext.value.length > 0">
                    <div class="vm-table-scroll">
                      <table class="vm-table bc-fields-table">
                        <thead><tr><th>Name</th><th>Field key</th><th>Value source</th><th>Status</th><th>Last updated</th><th></th></tr></thead>
                        <tbody>
                          <template x-for="field in businessContext.value" :key="field.key">
                            <tr>
                              <td><strong x-text="field.name"></strong></td>
                              <td class="mono" x-text="field.key"></td>
                              <td x-text="businessContextSourceLabel(field)"></td>
                              <td><span class="badge" :class="field.enabled ? 'ok' : 'muted'"
                                x-text="field.enabled ? 'Enabled' : 'Disabled'"></span></td>
                              <td class="mono" x-text="field.updatedAt ? formatDateTime(field.updatedAt) : '—'"></td>
                              <td class="actions"><button type="button" class="btn ghost" @click="openBusinessContextEditor(field)">Edit</button></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                    <div class="vm-table-footer">
                      <div class="vm-footer-left"
                        x-text="`${businessContext.count} of ${businessContext.maxFields} configured`"></div>
                    </div>
                  </div>
                </div>
              </template>
            </section>
          </template>

          <!-- Tab: Data Collection -->
          <template x-if="tab === 'data'">
            <div>
              <!-- Schedule (runtime-editable cadence + enablement) -->
              <div class="card">
                <div class="card-head">
                  <div class="title-row">
                    <h3>Data Collection Schedule</h3>
                  </div>
                </div>
                <div class="vm-command-bar">
                  <button type="button" class="vm-command-button" @click="loadPipelines()"
                    :disabled="dcPipelinesLoading">
                    <span class="vm-command-icon" :class="{ spinning: dcPipelinesLoading }" aria-hidden="true">&#8635;</span>
                    <span>Refresh</span>
                  </button>
                  <button type="button" class="vm-command-button" @click="resetPipelineDefaults()"
                    :disabled="dcResetting || dcPipelinesLoading">
                    <span class="vm-command-icon" :class="{ spinning: dcResetting }" aria-hidden="true">&#8634;</span>
                    <span>Reset defaults</span>
                  </button>
                </div>
                <template x-if="dcPipelinesError">
                  <div class="error" x-text="'Could not load schedule: ' + dcPipelinesError"></div>
                </template>
                <template x-if="dcPipelines && dcPipelines.length">
                  <div class="vm-table-frame dc-schedule-frame">
                    <div class="vm-table-scroll">
                      <table class="vm-table dc-schedule-table">
                        <thead>
                          <tr>
                            <th>Pipeline</th>
                            <th>Frequency</th>
                            <th>Last run</th>
                            <th>Status</th>
                            <th>Actions</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="row in dcPipelines" :key="row.id">
                            <tr>
                              <td x-text="row.name"></td>
                              <td>
                                <span class="editable-cell">
                                  <span x-text="dcFrequencyText(row)"></span>
                                  <button type="button" class="coverage-edit-button" @click.stop="openPipelineConfig(row)"
                                    title="Edit schedule" aria-label="Edit schedule">&#9998;</button>
                                </span>
                              </td>
                              <td>
                                <span class="dc-lastrun">
                                  <span x-text="row.lastCompletedAt ? relativeTimeText(row.lastCompletedAt, { short: true }) : '—'"
                                    :title="row.lastCompletedAt ? formatDateTime(row.lastCompletedAt) : ''"></span>
                                  <span x-show="pipelineDue(row)" class="dc-due-icon"
                                    :title="row.nextDueAt ? ('Due to run — scheduled ' + formatDateTime(row.nextDueAt)) : 'Due to run'"
                                    aria-label="Due to run">&#9200;</span>
                                </span>

    <template x-if="businessContextEditorOpen && businessContextDraft">

              <small x-text="businessContextFile ? businessContextFile.name : 'CSV or Excel (.xlsx), up to 10 MiB.'"></small>

                <span>Output</span>

                  <label><input type="radio" name="mg-output" value="hierarchy_path"
                    x-model="businessContextDraft.valueSource.config.outputMode" @change="invalidateBusinessContextPreview()" /> Full hierarchy path</label>
                </div>
              </div>

                  <option :value="option.key" :label="`${option.subscriptionCount} subscriptions`"></option>

              <span class="badge ok">Ready to save</span>

            <template x-for="item in [
              { label: 'Configured scope', summary: businessContextPreview && businessContextPreview.inScope },
              { label: 'Outside configured scope', summary: businessContextPreview && businessContextPreview.outsideScope }
            ]" :key="item.label">
              <div class="context-preview-section" x-show="item.summary">
                <h4 x-text="item.label"></h4>
                <div class="context-preview-metrics">
                  <span><strong x-text="item.summary ? item.summary.mappedSubscriptions : 0"></strong><small>Mapped</small></span>
                  <span><strong x-text="item.summary ? item.summary.unmappedSubscriptions : 0"></strong><small>Not mapped</small></span>
                  <span><strong x-text="item.summary ? item.summary.coveragePercent + '%' : '0%'"></strong><small>Coverage</small></span>
                </div>
                <div class="context-top-values" x-show="item.summary && businessContextTopValues(item.summary).length">
                  <span class="muted">Most common values</span>
                  <template x-for="value in (item.summary ? businessContextTopValues(item.summary) : [])" :key="value.value">
                    <div><span x-text="value.value"></span><strong x-text="value.subscriptionCount"></strong></div>
                  </template>
                </div>
                <div class="context-missing-reasons" x-show="item.summary && Object.keys(item.summary.unmappedByReason || {}).length">
                  <template x-for="reason in Object.entries(item.summary ? item.summary.unmappedByReason || {} : {})" :key="reason[0]">
                    <span><span x-text="reason[0].replaceAll('_', ' ')"></span>: <strong x-text="reason[1]"></strong></span>
                  </template>
                </div>
              </div>
            </template>
          </section>

          <div class="context-field-audit" x-show="businessContextEditingKey && businessContextDraft.updatedAt">
            Last updated <strong x-text="businessContextDraft.updatedAt ? formatDateTime(businessContextDraft.updatedAt) : ''"></strong>
            <span x-show="businessContextDraft.updatedBy && businessContextDraft.updatedBy.displayName"
              x-text="` by ${businessContextDraft.updatedBy ? businessContextDraft.updatedBy.displayName : ''}`"></span>
          </div>
        </div>

        <div class="business-context-editor-actions">
          <button type="button" class="btn danger" x-show="businessContextEditingKey" @click="deleteBusinessContext()"
            :disabled="businessContextDeleting || businessContextSaving || businessContextPreviewing">
            <span x-show="businessContextDeleting" class="spin"></span> Delete field
          </button>
          <span class="action-spacer"></span>
          <button type="button" class="btn ghost" @click="closeBusinessContextEditor()"
            :disabled="businessContextDeleting || businessContextSaving || businessContextPreviewing">Cancel</button>
          <button type="button" class="btn ghost" @click="previewBusinessContext()"
            :disabled="!businessContextCanPreview() || businessContextPreviewing || businessContextSaving">
            <span x-show="businessContextPreviewing" class="spin"></span> Preview values
          </button>
          <button type="button" class="btn" @click="saveBusinessContext()"
            :disabled="!businessContextPreviewValid || businessContextSaving || businessContextPreviewing">
            <span x-show="businessContextSaving" class="spin"></span> Save field
          </button>
        </div>
        </aside>
      </div>
    </template>

                    <section class="requirement-item">
                      <div class="requirement-heading">
                        <h3 x-text="requirement.label"></h3>
                        <span class="requirement-state" :class="odcrRequirementClass(requirement.status)">
                          <svg x-show="odcrRequirementIcon(requirement.status) === 'passed'" class="drawer-icon"
                            viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg>
                          <svg x-show="odcrRequirementIcon(requirement.status) === 'failed'" class="drawer-icon"
                            viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12" /></svg>
                          <svg x-show="odcrRequirementIcon(requirement.status) === 'unknown'" class="drawer-icon"
                            viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="M9.1 9a3 3 0 1 1 5.83 1c0 2-3 2-3 4M12 18h.01" /></svg>
                          <span x-text="requirement.status"></span>
                        </span>
                      </div>
                      <div class="requirement-detail" x-show="showOdcrRequirementReason(requirement)">
                        <p x-text="requirement.reason"></p>
                        <div><span class="muted">Observed: </span><span x-text="requirement.observedValue"></span></div>
                        <div class="mono requirement-resource" x-show="requirement.resourceId" x-text="requirement.resourceId"></div>
                      </div>
                    </section>
                  </template>
                  <div class="requirement-group-empty" x-show="group.items.length === 0">No requirements in this group.</div>
                </div>
              </section>
            </template>
          </div>
        </aside>
      </div>
    </template>
  </div>
</body>
</html>
